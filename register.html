{% extends 'base.html' %}{% block title %}Create Account | FoodieHub{% endblock %}{% block content %}<section class="auth"><div class="auth-art">🥗<span>Make every meal<br>worth remembering.</span></div><form class="auth-form" method="post"><span class="eyebrow dark">Join FoodieHub</span><h1>Create account</h1><p>Save your details and track every order.</p><label>Full name<input name="name" required placeholder="Your name"></label><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" minlength="6" required placeholder="Minimum 6 characters"></label><button class="btn primary full">Create Account</button><p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></form></section>{% endblock %}
