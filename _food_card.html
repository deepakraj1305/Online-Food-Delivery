<article class="food-card"><div class="food-image"><img src="{{ food['image'] }}" alt="{{ food['name'] }}" loading="lazy"><span class="heart">♡</span></div><div class="food-info"><div class="food-title"><h3>{{ food['name'] }}</h3><span class="rating">★ {{ food['rating'] }}</span></div><p>{{ food['description'] }}</p><div class="food-bottom"><strong>₹{{ '%.0f'|format(food['price']) }}</strong><a href="{{ url_for('add_to_cart',food_id=food['id']) }}" class="add-btn"><i class="fa-solid fa-cart-plus"></i> Add</a></div></div></article>
